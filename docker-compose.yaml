version: "3.9"

services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - bankapp-network

  ui:
    build:
      context: ./ui
    container_name: ui
    hostname: ui
    image: martian-bank-ui
    ports:
      - "3000:3000"
    restart: always
    networks:
      - bankapp-network

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    hostname: nginx
    image: martian-bank-nginx
    ports:
      - "8080:8080"
    depends_on:
      - customer-auth
      - atm-locator
      - ui
      - dashboard
    restart: always
    networks:
      - bankapp-network

  customer-auth:
    build:
      context: ./customer-auth
    container_name: customer-auth
    hostname: customer-auth
    image: martian-bank-customer-auth
    ports:
      - "8000:8000"
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      JWT_SECRET: martian-bank-dev-secret-change-me
      PORT: 8000
    depends_on:
      - mongo
    restart: always
    networks:
      - bankapp-network

  atm-locator:
    build:
      context: ./atm-locator
    container_name: atm-locator
    hostname: atm-locator
    image: martian-bank-atm-locator
    ports:
      - "8001:8001"
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      PORT: 8001
    depends_on:
      - mongo
    restart: always
    networks:
      - bankapp-network

  dashboard:
    container_name: dashboard
    hostname: dashboard
    ports:
      - "5000:5000"
    restart: always
    image: martian-bank-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      SERVICE_PROTOCOL: http
      ACCOUNT_HOST: accounts
      TRANSACTION_HOST: transactions
      LOAN_HOST: loan
      CUSTOMER_AUTH_HOST: customer-auth
      ATM_LOCATOR_HOST: atm-locator
    depends_on:
      - mongo
      - accounts
      - transactions
      - loan
    networks:
      - bankapp-network

  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    container_name: accounts
    hostname: accounts
    image: martian-bank-accounts
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      SERVICE_PROTOCOL: http
    depends_on:
      - mongo
    restart: always
    networks:
      - bankapp-network

  loan:
    build:
      context: .
      dockerfile: loan/Dockerfile
    container_name: loan
    hostname: loan
    image: martian-bank-loan
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      SERVICE_PROTOCOL: http
    depends_on:
      - mongo
    restart: always
    networks:
      - bankapp-network

  transactions:
    build:
      context: .
      dockerfile: transactions/Dockerfile
    container_name: transactions
    hostname: transactions
    image: martian-bank-transactions
    environment:
      DB_URL: mongodb://root:example@mongo:27017
      SERVICE_PROTOCOL: http
    depends_on:
      - mongo
    restart: always
    networks:
      - bankapp-network

  locust:
    build:
      context: ./performance_locust
    container_name: locust
    hostname: locust
    ports:
      - "8089:8089"
    image: martian-bank-locust
    restart: always
    networks:
      - bankapp-network

networks:
  bankapp-network:
    driver: bridge
